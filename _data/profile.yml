about:
  - "Titulaire d’un parcours de niveau Bac +7 avec le DQPRM, Diplôme de Qualification en Physique Radiologique et Médicale, je me suis spécialisée dans l’application de la physique aux domaines de la santé, de l’imagerie, de la dosimétrie, de la radioprotection et de l’utilisation médicale des rayonnements ionisants."

  - "Au-delà de la physique médicale clinique, je souhaite orienter mon parcours vers la recherche doctorale à l’interface entre physique, santé et numérique. Je m’intéresse notamment à la modélisation biomédicale, à l’imagerie médicale, à la simulation numérique, à l’analyse de données, à la biomécanique et aux technologies innovantes pour le diagnostic ou la prise en charge médicale."

  - "Mon profil combine une formation spécialisée en physique radiologique et médicale avec un intérêt plus large pour les approches computationnelles, la modélisation de systèmes biologiques, le traitement de données médicales et les outils numériques appliqués à la recherche biomédicale."

  - "Ce portfolio présente mes projets, compétences, outils et certifications afin de montrer mon évolution vers un profil de recherche capable de travailler sur des problématiques interdisciplinaires entre physique, santé, ingénierie biomédicale et science des données."
