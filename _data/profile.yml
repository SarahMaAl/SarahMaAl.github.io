about:
  - "Après l’obtention de mon master en Physique médicale et radioprotection de l’homme et de l’environnement, j’ai été admise au concours du DQPRM, Diplôme de Qualification en Physique Radiologique et Médicale. Je suis actuellement étudiante dans cette formation spécialisée, dont l’obtention est prévue en février 2027."

  - "Le DQPRM s’inscrit dans un parcours de niveau Bac +7 en physique appliquée à la santé et me permet de consolider des compétences en physique médicale, dosimétrie, radioprotection, imagerie médicale, radiothérapie, médecine nucléaire et utilisation médicale des rayonnements ionisants."

  - "Au-delà de la physique médicale clinique, je souhaite orienter mon parcours vers la recherche doctorale à l’interface entre physique, santé et numérique. Je m’intéresse notamment à la modélisation biomédicale, à l’imagerie médicale, à la simulation numérique, à l’analyse de données, à la biomécanique et aux technologies innovantes pour le diagnostic ou la prise en charge médicale."

  - "Mon profil combine une formation spécialisée en physique médicale et radioprotection avec une formation avancée en physique radiologique et médicale, ainsi qu’un intérêt plus large pour les approches computationnelles, la modélisation de systèmes biologiques, le traitement de données médicales et les outils numériques appliqués à la recherche biomédicale."

  - "Ce portfolio présente mes projets, compétences, outils et certifications afin de montrer mon évolution vers un profil de recherche capable de travailler sur des problématiques interdisciplinaires entre physique, santé, ingénierie biomédicale et science des données."
