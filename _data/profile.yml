about:
  - "Je m’intéresse aux applications de la physique, des mathématiques, de la simulation numérique et de l’analyse de données dans le domaine de la santé et du biomédical."
  - "Mon objectif est de poursuivre en doctorat sur des problématiques interdisciplinaires liées à la modélisation de systèmes biologiques, l’imagerie médicale, la biomécanique, la simulation de phénomènes physiques, l’aide au diagnostic ou le développement d’outils numériques pour la santé."
  - "Mon profil combine une base en physique médicale avec un intérêt plus large pour la physique appliquée, la modélisation, les données, les outils computationnels et les technologies biomédicales."
  - "Ce portfolio présente mes projets, compétences, outils et certifications afin de montrer ma progression vers un profil de recherche à l’interface entre physique, santé, numérique et ingénierie biomédicale."
